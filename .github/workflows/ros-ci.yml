name: ROS CI
on:
  push:
    branches: [main, dev, 'codex/ros-compatibility']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ros-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  python-core:
    name: ROS model and contract fixtures (Windows development host)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.316'
      - run: python -m pip install pythonnet==3.0.5 PyYAML==6.0.3
      - name: Verify committed wrapper pin and complete payload provenance
        shell: pwsh
        run: |
          $entry = git ls-tree HEAD -- HFI_WSS_Python_Interface
          $sha = git -C HFI_WSS_Python_Interface rev-parse HEAD
          if ($entry -cne "160000 commit $sha`tHFI_WSS_Python_Interface") { throw 'Wrapper differs from committed pin.' }
          ./.github/scripts/Verify-RosPayload.ps1 -OutputPath results/payload.json
      - name: ROS contract, import, config and lifecycle doubles
        run: python -m unittest discover -s tests -v
      - name: Actual Python wrapper and Core over emulator only
        run: python -u conformance/ros_emulator.py --output results/emulator.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-model-evidence
          if-no-files-found: error
          path: results/*.json
  ros-build:
    name: ROS colcon and installed DDS fixture (Humble development baseline)
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 20
    steps:
      - name: Install development build and test prerequisites
        run: |
          apt-get update
          apt-get install -y git python3-pip python3-colcon-common-extensions ros-humble-ament-cmake-python ros-humble-launch-ros
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          persist-credentials: false
      - name: Install wrapper prerequisite without selecting a CLR
        run: python3 -m pip install pythonnet==3.0.5
      - name: Build symlink layout and verify launch registration and DDS callbacks
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          python3 -m unittest discover -s tests -v
          colcon build --packages-select hfi_ros_wss_driver --symlink-install
          source install/setup.bash
          ros2 launch hfi_ros_wss_driver launch_ros_wss_driver.launch.py --show-args
          cp conformance/ros_native.py /tmp/ros-native-symlink.py
          mkdir -p "$GITHUB_WORKSPACE/results"
          cd /tmp
          python3 /tmp/ros-native-symlink.py --output "$GITHUB_WORKSPACE/results/native-symlink.json"
      - name: Build copied layout and verify operation away from the checkout
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          colcon --log-base log-copy build --packages-select hfi_ros_wss_driver --build-base build-copy --install-base install-copy
          source install-copy/setup.bash
          ros2 launch hfi_ros_wss_driver launch_ros_wss_driver.launch.py --show-args
          cp conformance/ros_native.py /tmp/ros-native-copy.py
          cd /tmp
          python3 /tmp/ros-native-copy.py --output "$GITHUB_WORKSPACE/results/native-copy.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ros-native-evidence
          if-no-files-found: error
          path: results/*.json
  acceptance:
    name: ROS compatibility
    if: always()
    needs: [python-core, ros-build]
    runs-on: ubuntu-latest
    steps:
      - name: Require both independently executed development suites
        env:
          MODEL_RESULT: ${{ needs.python-core.result }}
          ROS_RESULT: ${{ needs.ros-build.result }}
        run: test "$MODEL_RESULT" = success && test "$ROS_RESULT" = success
