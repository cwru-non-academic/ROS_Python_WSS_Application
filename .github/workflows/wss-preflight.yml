name: WSS ROS preflight
run-name: WSS preflight ${{ fromJSON(inputs.candidate_json).run_id }} / ${{ inputs.correlation_id }}
on:
  workflow_dispatch:
    inputs:
      candidate_json: {required: true, type: string}
      wrapper_sha: {required: true, type: string}
      ros_sha: {required: true, type: string}
      correlation_id: {required: true, type: string}
env:
  ROS_MODE: candidate
  WSS_CI_CHANNEL: ${{ github.ref_name }}
  WSS_TARGET_ROOT: ${{ github.workspace }}/source
  WSS_CORE_TOOLS_ROOT: ${{ github.workspace }}/workflow-guard
permissions:
  contents: read
concurrency:
  group: ros-preflight-${{ inputs.correlation_id || github.ref }}
  cancel-in-progress: false
jobs:
  python-core:
    name: ROS model and contract fixtures (Windows development host)
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      wrapper: ${{ steps.sources.outputs.wrapper }}
      projection_record_sha256: ${{ steps.transfer.outputs.projection_record_sha256 }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ros_sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - &ros_candidate_context
        name: Require exact ROS candidate context before credentials
        id: sources
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ inputs.wrapper_sha }}
          ROS_SHA: ${{ inputs.ros_sha }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
          CORRELATION: ${{ inputs.correlation_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_ACTIONS -cne 'true' -or $env:GITHUB_REPOSITORY -cne 'cwru-non-academic/ROS_Python_WSS_Application' -or $env:GITHUB_EVENT_NAME -cne 'workflow_dispatch' -or $env:ROS_MODE -cne 'candidate') { throw 'Candidate preflight requires its registered ROS dispatch.' }
          $paths = & node --input-type=module -e 'import {realpathSync} from "node:fs"; console.log(JSON.stringify(process.argv.slice(1).map(p => realpathSync(p))));' (Join-Path $env:GITHUB_WORKSPACE 'source') $env:WSS_TARGET_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the verified ROS target root.' }
          $roots = ($paths -join "`n") | ConvertFrom-Json
          if ($roots.Count -ne 2 -or $roots[0] -cne $roots[1]) { throw 'Target root differs from the verified ROS checkout.' }
          $root = $roots[0]
          if ($env:GITHUB_REF -cnotin @('refs/heads/dev','refs/heads/main')) { throw 'Target workflow ref is outside the registered ROS channels.' }
          if ($env:GITHUB_WORKFLOW_REF -cne "$($env:GITHUB_REPOSITORY)/.github/workflows/wss-preflight.yml@$($env:GITHUB_REF)") { throw 'Candidate preflight workflow identity differs.' }
          $source = (& git -C $root rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $source -cnotmatch '^[0-9a-f]{40}$' -or $source -cne $env:GITHUB_SHA -or $source -cne $env:GITHUB_WORKFLOW_SHA -or $env:ROS_SHA -cne $source) { throw 'ROS source differs from the exact workflow source.' }
          $dirty = & git -C $root status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'ROS candidate source must be clean.' }
          . (Join-Path $root '.github/scripts/wss-ci/Channel.ps1')
          $context = Get-WssCiChannelContext
          Assert-WssCiTargetRef $context.channel
          if ($env:WRAPPER_SHA -cnotmatch '^[0-9a-f]{40}$') { throw 'Candidate preflight requires an exact wrapper source.' }
          $config = Get-Content -LiteralPath (Join-Path $root '.github/python-layered-ci.json') -Raw | ConvertFrom-Json
          if ($config.schema -cne 'wss-python-ci/v1' -or $config.baseline_ready -ne $true -or $config.automated_execution -cne 'pythonnet' -or $config.dotnet_sdk -cne '9.0.316' -or @($config.channels) -cnotcontains $context.channel) { throw 'Requested candidate channel capability has not been adopted.' }
          $raw = & node --input-type=module -e 'import {pathToFileURL} from "node:url"; const v=await import(pathToFileURL(process.argv[1])); const c=JSON.parse(process.argv[2]); v.candidate(c); console.log(JSON.stringify(c));' (Join-Path $root '.github/scripts/wss-ci/verify.mjs') $env:CANDIDATE_JSON
          if ($LASTEXITCODE -ne 0) { throw 'Canonical candidate identity is invalid.' }
          $c = ($raw -join "`n") | ConvertFrom-Json
          if ($env:CORRELATION -cne "wss-$($c.run_id)-$($c.artifact_id)-$($env:WRAPPER_SHA)-$source") { throw 'Candidate/source correlation mismatch.' }
          "wrapper=$($env:WRAPPER_SHA)" >> $env:GITHUB_OUTPUT
      - &ros_guard_lock
        name: Read ROS-owned locked Core guard source
        id: guard
        shell: pwsh
        run: |
          $lock = Get-Content -LiteralPath (Join-Path $env:WSS_TARGET_ROOT '.github/scripts/wss-ci.lock.json') -Raw | ConvertFrom-Json
          if ($lock.repository -cne $env:GITHUB_REPOSITORY -or $lock.source_repository -cne 'cwru-non-academic/WSSCore' -or $lock.source_commit -cnotmatch '^[a-f0-9]{40}$' -or $lock.source_ref -cne "refs/heads/ci/tooling/$($lock.source_commit)") { throw 'Invalid ROS-owned immutable Core guard lock.' }
          "commit=$($lock.source_commit)" >> $env:GITHUB_OUTPUT
      - &ros_guard_checkout
        uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/WSSCore
          ref: ${{ steps.guard.outputs.commit }}
          path: workflow-guard
          persist-credentials: false
      - &ros_guard_identity
        name: Verify locked Core guard checkout before credentials
        shell: pwsh
        run: |
          $paths = & node --input-type=module -e 'import {realpathSync} from "node:fs"; console.log(JSON.stringify(process.argv.slice(1).map(p => realpathSync(p))));' (Join-Path $env:GITHUB_WORKSPACE 'workflow-guard') $env:WSS_CORE_TOOLS_ROOT
          if ($LASTEXITCODE -ne 0) { throw 'Cannot resolve the locked Core guard root.' }
          $roots = ($paths -join "`n") | ConvertFrom-Json
          if ($roots.Count -ne 2 -or $roots[0] -cne $roots[1]) { throw 'Core guard root differs from its declared checkout.' }
          $lock = Get-Content -LiteralPath (Join-Path $env:WSS_TARGET_ROOT '.github/scripts/wss-ci.lock.json') -Raw | ConvertFrom-Json
          $head = (& git -C $roots[0] rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $head -cne $lock.source_commit) { throw 'Core guard revision differs from the ROS-owned lock.' }
          $dirty = & git -C $roots[0] status --porcelain --untracked-files=no
          if ($LASTEXITCODE -ne 0 -or $dirty) { throw 'Core guard checkout must be clean.' }
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: 12822b0567c918daa04bf486afca951adde9fca0
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ steps.sources.outputs.wrapper }}
          path: wrapper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: fc427c5b8bc6534a7d02f00283830072572aa03a
          path: fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.316'
      - run: python -m pip install pythonnet==3.0.5 PyYAML==6.0.3
      - uses: actions/create-github-app-token@v2
        if: env.ROS_MODE == 'candidate'
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Resolve exact producer artifact without fallback
        if: env.ROS_MODE == 'candidate'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tools/.github/scripts/PythonPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $c
          ./tools/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Execute unchanged canonical corpus through the ROS production factory
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ steps.sources.outputs.wrapper }}
        run: |
          $options = @{
            WrapperRoot = "$env:GITHUB_WORKSPACE/wrapper"
            FixtureRoot = "$env:GITHUB_WORKSPACE/fixture"
            WrapperSha = $env:WRAPPER_SHA
            RosRoot = "$env:GITHUB_WORKSPACE/source"
            RosSha = $env:GITHUB_SHA
            ToolsRoot = "$env:GITHUB_WORKSPACE/tools"
            ConfigPath = "$env:GITHUB_WORKSPACE/source/.github/python-layered-ci.json"
            OutputRoot = "$env:RUNNER_TEMP/canonical"
            Mode = $env:ROS_MODE
          }
          if ($env:ROS_MODE -ceq 'candidate') {
            $options.ArtifactRoot = "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
            $options.CandidatePath = "$env:RUNNER_TEMP/resolved/candidate.json"
          }
          ./source/.github/scripts/Invoke-LayeredRosConformance.ps1 @options
      - name: Stage verified complete payload for model and native ROS suites
        id: transfer
        shell: pwsh
        run: |
          . ./tools/.github/scripts/PythonContract.ps1
          $record = Get-Content "$env:RUNNER_TEMP/canonical/projection.json" -Raw | ConvertFrom-Json
          $payload = if ($env:ROS_MODE -ceq 'candidate') { "$env:RUNNER_TEMP/canonical/projection" } else { "$env:GITHUB_WORKSPACE/wrapper/Cs_Libraries" }
          Assert-PythonProjection $payload $record
          ./source/.github/scripts/Stage-RosRuntime.ps1 -RosRoot "$env:GITHUB_WORKSPACE/source" -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -PayloadRoot $payload -ProjectionPath "$env:RUNNER_TEMP/canonical/projection.json" -ToolsRoot "$env:GITHUB_WORKSPACE/tools" -Destination "$env:RUNNER_TEMP/ros-runtime"
          New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/ros-transfer" | Out-Null
          Copy-Item -LiteralPath $payload -Destination "$env:RUNNER_TEMP/ros-transfer/payload" -Recurse
          Copy-Item -LiteralPath "$env:RUNNER_TEMP/canonical/projection.json" -Destination "$env:RUNNER_TEMP/ros-transfer/projection.json"
          "projection_record_sha256=$((Get-FileHash "$env:RUNNER_TEMP/ros-transfer/projection.json").Hash.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: ROS contracts, imports, configuration and lifecycle
        shell: pwsh
        run: |
          Set-Location "$env:RUNNER_TEMP/ros-runtime"
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { throw 'ROS contract fixtures failed.' }
          python -u conformance/ros_emulator.py --output "$env:RUNNER_TEMP/canonical/ros-model.json"
          if ($LASTEXITCODE -ne 0) { throw 'ROS model fixtures failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: ros-staged-payload
          if-no-files-found: error
          path: ${{ runner.temp }}/ros-transfer/
      - uses: actions/upload-artifact@v4
        with:
          name: ros-canonical-evidence
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/canonical/evidence.json
            ${{ runner.temp }}/canonical/results.xml
            ${{ runner.temp }}/canonical/dotnet.log
            ${{ runner.temp }}/canonical/projection.json
            ${{ runner.temp }}/canonical/multi/evidence.json
            ${{ runner.temp }}/canonical/multi/results.xml
            ${{ runner.temp }}/canonical/multi/dotnet.log
            ${{ runner.temp }}/canonical/multi/projection.json
            ${{ runner.temp }}/canonical/ros-model.json
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ros-canonical-diagnostics
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/canonical/*.log
            ${{ runner.temp }}/canonical/nunit/*.xml
            ${{ runner.temp }}/canonical/multi/*.log
            ${{ runner.temp }}/canonical/multi/nunit/*.xml
  platform-compatibility:
    name: ROS platform compatibility (${{ matrix.name }})
    needs: python-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-2022
            arch: x64
          - name: Ubuntu
            os: ubuntu-latest
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ros_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - *ros_candidate_context
      - *ros_guard_lock
      - *ros_guard_checkout
      - *ros_guard_identity
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ needs.python-core.outputs.wrapper }}
          path: wrapper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: 12822b0567c918daa04bf486afca951adde9fca0
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: fc427c5b8bc6534a7d02f00283830072572aa03a
          path: fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.316'
      - run: python -m pip install build==1.2.2.post1 pythonnet==3.0.5 PyYAML==6.0.3
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Resolve exact canonical producer payload without fallback
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tools/.github/scripts/PythonPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $c
          ./tools/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Verify exact universal package and Core rejection fixtures
        if: runner.os == 'Linux'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & dotnet build workflow-guard/tools/ArtifactBuild/ArtifactBuild.csproj -p:RestoreLockedMode=true --nologo
          if ($LASTEXITCODE -ne 0) { throw 'Locked Core package verifier build failed.' }
          & python workflow-guard/tests/Packaging/verify_universal.py "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal"
          if ($LASTEXITCODE -ne 0) { throw 'Exact universal package or Core rejection fixture failed.' }
      - name: Check actual application contracts, model and platform runtime
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ needs.python-core.outputs.wrapper }}
        run: |
          ./source/.github/scripts/Invoke-RosPlatformCompatibility.ps1 -RosRoot "$env:GITHUB_WORKSPACE/source" -RosSha $env:GITHUB_SHA -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -WrapperSha $env:WRAPPER_SHA -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -ToolsRoot "$env:GITHUB_WORKSPACE/tools" -OutputRoot "$env:RUNNER_TEMP/ros-platform" -Mode candidate -ArtifactRoot "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal" -CandidatePath "$env:RUNNER_TEMP/resolved/candidate.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-preflight-platform-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ros-platform/wrapper-platform/platform.json
            ${{ runner.temp }}/ros-platform/wrapper-platform/platform.trx
            ${{ runner.temp }}/ros-platform/wrapper-platform/python-smoke.json

  macos-architectures:
    name: ROS platform compatibility (${{ matrix.display }})
    needs: python-core
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS-x64
            display: macOS Intel (x64)
            os: macos-15-intel
            arch: x64
          - name: macOS-arm64
            display: macOS Apple Silicon (arm64)
            os: macos-15
            arch: arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      WSS_EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ros_sha }}
          path: source
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - *ros_candidate_context
      - *ros_guard_lock
      - *ros_guard_checkout
      - *ros_guard_identity
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ needs.python-core.outputs.wrapper }}
          path: wrapper
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: 12822b0567c918daa04bf486afca951adde9fca0
          path: tools
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/CSharp_WSS_Integration_Lib
          ref: fc427c5b8bc6534a7d02f00283830072572aa03a
          path: fixture
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: ${{ matrix.arch }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.316'
      - run: python -m pip install build==1.2.2.post1 pythonnet==3.0.5 PyYAML==6.0.3
      - uses: actions/create-github-app-token@v2
        id: read
        with:
          app-id: ${{ vars.WSS_GITHUB_APP_ID }}
          private-key: ${{ secrets.WSS_GITHUB_APP_PRIVATE_KEY }}
          owner: cwru-non-academic
          repositories: WSSCore
          permission-contents: read
          permission-actions: read
      - name: Resolve exact canonical producer payload without fallback
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.read.outputs.token }}
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          . ./tools/.github/scripts/PythonPromotion.ps1
          $c = $env:CANDIDATE_JSON | ConvertFrom-Json
          Assert-PythonProducer $c
          ./tools/.github/scripts/Resolve-WssRelease.ps1 -RunId $c.run_id -ExpectedArtifactId $c.artifact_id -ExpectedCommit $c.commit -ArchiveName $c.archive -ExpectedSha256 $c.sha256 -OutputRoot "$env:RUNNER_TEMP/resolved"
      - name: Check actual application contracts, model and platform runtime
        shell: pwsh
        env:
          WRAPPER_SHA: ${{ needs.python-core.outputs.wrapper }}
        run: |
          ./source/.github/scripts/Invoke-RosPlatformCompatibility.ps1 -RosRoot "$env:GITHUB_WORKSPACE/source" -RosSha $env:GITHUB_SHA -WrapperRoot "$env:GITHUB_WORKSPACE/wrapper" -WrapperSha $env:WRAPPER_SHA -FixtureRoot "$env:GITHUB_WORKSPACE/fixture" -ToolsRoot "$env:GITHUB_WORKSPACE/tools" -OutputRoot "$env:RUNNER_TEMP/ros-platform" -Mode candidate -ArtifactRoot "$env:RUNNER_TEMP/resolved/extracted/WSS-Universal" -CandidatePath "$env:RUNNER_TEMP/resolved/candidate.json"
      - name: Record native macOS architecture worker outcome
        if: always()
        shell: pwsh
        env:
          WORKER_CONCLUSION: ${{ job.status }}
          EXPECTED_ARCHITECTURE: ${{ matrix.arch }}
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'ros-platform/wrapper-platform'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          . ./tools/.github/scripts/wss-ci/Evidence.ps1
          $identity=New-WssCiEvidenceIdentity $env:GITHUB_REPOSITORY $env:GITHUB_RUN_ID $env:GITHUB_RUN_ATTEMPT $env:GITHUB_SHA $env:EXPECTED_ARCHITECTURE
          @{schema='wss-macos-worker/v1';ci=$identity;architecture=$env:EXPECTED_ARCHITECTURE;conclusion=$env:WORKER_CONCLUSION;repository=$env:GITHUB_REPOSITORY;run_id=$env:GITHUB_RUN_ID;source_sha=$env:GITHUB_SHA} | ConvertTo-Json -Depth 6 | Set-Content (Join-Path $root 'outcome.json')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-preflight-platform-${{ matrix.name }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/ros-platform/wrapper-platform/platform.json
            ${{ runner.temp }}/ros-platform/wrapper-platform/outcome.json
            ${{ runner.temp }}/ros-platform/wrapper-platform/platform.trx
            ${{ runner.temp }}/ros-platform/wrapper-platform/python-smoke.json

  macos-compatibility:
    name: ROS platform compatibility (macOS)
    if: always()
    needs: [macos-architectures, python-core]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: 12822b0567c918daa04bf486afca951adde9fca0
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: python-preflight-platform-macOS-*
          path: ${{ runner.temp }}/macos-inputs
      - name: Require native Intel and Apple Silicon consumer proofs
        shell: pwsh
        env:
          MACOS_WORKER_RESULT: ${{ needs.macos-architectures.result }}
        run: |
          ./tools/.github/scripts/Complete-MacOSConsumer.ps1 -InputRoot "$env:RUNNER_TEMP/macos-inputs" -OutputRoot "$env:RUNNER_TEMP/macos-complete" -ArtifactPrefix 'python-preflight-platform' -EvidenceSubdirectory '' -WorkerResult $env:MACOS_WORKER_RESULT
      - uses: actions/upload-artifact@v4
        with:
          name: python-preflight-platform-macOS
          retention-days: 14
          if-no-files-found: error
          path: ${{ runner.temp }}/macos-complete/

  ros-build:
    name: ROS colcon and installed DDS fixture (Humble development baseline)
    needs: python-core
    runs-on: ubuntu-22.04
    container: ros:humble-ros-base-jammy
    timeout-minutes: 20
    steps:
      - name: Install development prerequisites
        run: |
          apt-get update
          apt-get install -y git python3-pip python3-colcon-common-extensions ros-humble-ament-cmake-python ros-humble-launch-ros
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ros_sha || github.sha }}
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: ${{ needs.python-core.outputs.wrapper }}
          path: wrapper
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ros-staged-payload
          path: transfer
      - name: Verify exact cross-job payload and stage an isolated application
        shell: bash
        env:
          RECORD_SHA256: ${{ needs.python-core.outputs.projection_record_sha256 }}
        run: |
          set -eo pipefail
          python3 source/.github/scripts/verify_staged_payload.py transfer "$RECORD_SHA256"
          mkdir "$RUNNER_TEMP/ros-runtime"
          git -C source archive HEAD | tar -x -C "$RUNNER_TEMP/ros-runtime"
          mkdir -p "$RUNNER_TEMP/ros-runtime/HFI_WSS_Python_Interface"
          cp -a wrapper/src "$RUNNER_TEMP/ros-runtime/HFI_WSS_Python_Interface/src"
          cp -a transfer/payload "$RUNNER_TEMP/ros-runtime/HFI_WSS_Python_Interface/Cs_Libraries"
          python3 -m pip install pythonnet==3.0.5
      - name: Build symlink layout and verify launch and DDS callbacks
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          cd "$RUNNER_TEMP/ros-runtime"
          python3 -m unittest discover -s tests -v
          colcon build --packages-select hfi_ros_wss_driver --symlink-install
          source install/setup.bash
          ros2 launch hfi_ros_wss_driver launch_ros_wss_driver.launch.py --show-args
          cp conformance/ros_native.py /tmp/ros-native-symlink.py
          mkdir -p "$GITHUB_WORKSPACE/results"
          cd /tmp
          python3 /tmp/ros-native-symlink.py --projection "$GITHUB_WORKSPACE/transfer/projection.json" --output "$GITHUB_WORKSPACE/results/ros-native-symlink.json"
      - name: Build copied layout and verify operation away from the checkout
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/humble/setup.bash
          cd "$RUNNER_TEMP/ros-runtime"
          colcon --log-base log-copy build --packages-select hfi_ros_wss_driver --build-base build-copy --install-base install-copy
          source install-copy/setup.bash
          ros2 launch hfi_ros_wss_driver launch_ros_wss_driver.launch.py --show-args
          cp conformance/ros_native.py /tmp/ros-native-copy.py
          cd /tmp
          python3 /tmp/ros-native-copy.py --projection "$GITHUB_WORKSPACE/transfer/projection.json" --output "$GITHUB_WORKSPACE/results/ros-native-copy.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ros-native-evidence
          if-no-files-found: error
          path: results/*.json
  acceptance:
    name: ROS compatibility
    if: always()
    needs: [python-core, ros-build, platform-compatibility, macos-compatibility]
    runs-on: windows-2022
    steps:
      - name: Reject skipped or failed suites before assembling evidence
        shell: pwsh
        env:
          MODEL_RESULT: ${{ needs.python-core.result }}
          ROS_RESULT: ${{ needs.ros-build.result }}
          PLATFORM_RESULT: ${{ needs.platform-compatibility.result }}
          MACOS_RESULT: ${{ needs.macos-compatibility.result }}
        run: |
          if ($env:MODEL_RESULT -cne 'success' -or $env:ROS_RESULT -cne 'success' -or $env:PLATFORM_RESULT -cne 'success' -or $env:MACOS_RESULT -cne 'success') { throw 'Both independent suites must succeed.' }
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ros_sha || github.sha }}
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: cwru-non-academic/Python_WSS_Integration_Lib
          ref: 12822b0567c918daa04bf486afca951adde9fca0
          path: tools
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: ros-canonical-evidence
          path: ${{ runner.temp }}/ros-evidence
      - uses: actions/download-artifact@v4
        with:
          name: ros-native-evidence
          path: ${{ runner.temp }}/ros-evidence
      - name: Verify all eleven files with the versioned shared ROS validators
        shell: pwsh
        run: ./.github/scripts/Complete-LayeredRosEvidence.ps1 -ToolsRoot "$env:GITHUB_WORKSPACE/tools" -Root "$env:RUNNER_TEMP/ros-evidence"
      - name: Run negative evidence safety checks
        shell: pwsh
        run: ./.github/scripts/Test-LayeredRosEvidence.ps1 -ToolsRoot "$env:GITHUB_WORKSPACE/tools" -Root "$env:RUNNER_TEMP/ros-evidence"
      - uses: actions/upload-artifact@v4
        with:
          name: python-preflight-evidence
          if-no-files-found: error
          path: ${{ runner.temp }}/ros-evidence/
      - name: Add normalized candidate binding after all existing proofs passed
        shell: pwsh
        env:
          CANDIDATE_JSON: ${{ inputs.candidate_json }}
        run: |
          ./tools/.github/scripts/Write-CandidateProvenance.ps1 -CandidateJson $env:CANDIDATE_JSON -EvidenceRoot "$env:RUNNER_TEMP/ros-evidence" -OutputPath "$env:RUNNER_TEMP/candidate-provenance/candidate.json"
      - uses: actions/upload-artifact@v4
        with:
          name: wss-candidate-provenance
          retention-days: 90
          if-no-files-found: error
          path: ${{ runner.temp }}/candidate-provenance/candidate.json
